server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ruffle ships .wasm; the wrong type stops the emulator from streaming-compiling.
    types { application/wasm wasm; }

    # Ruffle compiles WebAssembly, which needs wasm-unsafe-eval. Everything is local.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # The game file lives in the volume, not in the image.
    location /game/ {
        alias /srv/game/;
        types { application/x-shockwave-flash swf; }
        default_type application/x-shockwave-flash;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # A missing file here means the download has not finished yet.
        error_page 404 = @game_missing;
    }
    location @game_missing {
        add_header Content-Type text/plain always;
        return 503 "game file not ready\n";
    }

    location /ruffle/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
        # nginx only inherits add_header from an outer level when the inner level
        # declares none, so the security headers must be repeated here or setting
        # Cache-Control would silently drop them from every page response.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types application/javascript text/css application/wasm text/html application/json;
    gzip_min_length 1024;
}
