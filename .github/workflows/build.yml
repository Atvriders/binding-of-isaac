name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx --yes playwright-core install --with-deps chromium || npx --yes playwright install --with-deps chromium

      - name: Fetch Ruffle and the game file
        run: ./scripts/fetch-assets.sh

      - name: Run the full suite
        working-directory: tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        if: github.event_name != 'pull_request'
        env:
          RAW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eux
          # github.repository preserves the owner's capitalisation, but Docker
          # reference names must be lowercase.
          IMG=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker run -d --name isaac -p 8080:80 "$IMG:latest"

          # First start downloads the game file into the volume, so allow for it.
          ok=""
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' isaac)" != "true" ]; then
              echo "container exited early:"; docker logs isaac; exit 1
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "never became healthy:"; docker logs isaac; exit 1; fi

          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/ruffle/ruffle.js

          # The page must be served with the CSP, not just have it in the config.
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"

          # The entrypoint must have fetched and verified the game into the volume.
          docker exec isaac sh -c 'test -s /srv/game/isaac.swf'
          docker exec isaac sh -c \
            'sha256sum /srv/game/isaac.swf | grep -q 3535d67fa608f28ea13697ba711a22922ab107daf5614978da3a07b623a6a761'

          # And it must refuse to serve a corrupted one.
          docker exec isaac sh -c 'echo broken > /srv/game/isaac.swf'
          if docker run --rm --volumes-from isaac \
               -e GAME_SHA256=3535d67fa608f28ea13697ba711a22922ab107daf5614978da3a07b623a6a761 \
               "$IMG:latest" true 2>/dev/null; then
            echo "entrypoint accepted a corrupt game file"; exit 1
          fi
          echo "image smoke test passed"
          docker logs isaac
          docker rm -f isaac
