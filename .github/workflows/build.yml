name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx --yes playwright-core install --with-deps chromium || npx --yes playwright install --with-deps chromium

      - name: Fetch Ruffle and the game file
        run: ./scripts/fetch-assets.sh

      - name: Run the full suite
        working-directory: tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        if: github.event_name != 'pull_request'
        env:
          RAW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eux
          # github.repository preserves the owner's capitalisation, but Docker
          # reference names must be lowercase.
          IMG=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker run -d --name isaac -p 8080:80 "$IMG:latest"

          # First start downloads the game file into the volume, so allow for it.
          ok=""
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' isaac)" != "true" ]; then
              echo "container exited early:"; docker logs isaac; exit 1
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "never became healthy:"; docker logs isaac; exit 1; fi

          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/ruffle/ruffle.js

          # The page must be served with the CSP, not just have it in the config.
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"

          # Content types must be right, or the browser downloads the page instead
          # of rendering it. Only a real nginx can prove this.
          ct() { curl -fsSI "http://127.0.0.1:8080$1" \
                   | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}'; }
          echo "html: $(ct /)"; echo "js:   $(ct /js/boot.js)"; echo "css:  $(ct /css/app.css)"
          case "$(ct /)" in text/html*) ;; *) echo "index.html is not text/html"; exit 1;; esac
          case "$(ct /js/boot.js)" in *javascript*) ;; *) echo "js has wrong type"; exit 1;; esac
          case "$(ct /css/app.css)" in text/css*) ;; *) echo "css has wrong type"; exit 1;; esac

          WASM=$(docker exec isaac sh -c 'cd /usr/share/nginx/html/ruffle && ls *.wasm | head -1')
          echo "wasm: $(ct /ruffle/$WASM)"
          case "$(ct /ruffle/$WASM)" in application/wasm*) ;;
            *) echo "wasm has wrong type; Ruffle cannot stream-compile it"; exit 1;; esac

          # The entrypoint must have fetched and verified the game into the volume.
          docker exec isaac sh -c 'test -s /srv/game/isaac.swf'
          docker exec isaac sh -c \
            'sha256sum /srv/game/isaac.swf | grep -q 3535d67fa608f28ea13697ba711a22922ab107daf5614978da3a07b623a6a761'

          # And it must refuse to serve a corrupted one. This needs a real bind
          # mount: the running container has no declared volume, so --volumes-from
          # would share nothing and the check would silently pass against a fresh
          # download instead of the corrupt file.
          mkdir -p /tmp/badgame
          echo broken > /tmp/badgame/isaac.swf
          if docker run --rm -v /tmp/badgame:/srv/game \
               -e GAME_SHA256=3535d67fa608f28ea13697ba711a22922ab107daf5614978da3a07b623a6a761 \
               "$IMG:latest" true; then
            echo "entrypoint accepted a corrupt game file"; exit 1
          fi
          echo "entrypoint correctly refused a corrupt game file"

          # A user-supplied file with checking disabled must still be accepted.
          docker run --rm -v /tmp/badgame:/srv/game -e GAME_SHA256=skip "$IMG:latest" true
          echo "image smoke test passed"
          docker logs isaac
          docker rm -f isaac
